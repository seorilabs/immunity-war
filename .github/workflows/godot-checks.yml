# main 정적 게이트(Godot) — org 재사용 워크플로우 호출.
# import → compile/quality gate → smoke. 무거운 export/배포 금지.
name: Godot Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: seorilabs/.github/.github/workflows/godot-checks.yml@main
    with:
      godot_version: "4.7.2"
      with_export_templates: true
      runs_on: seorilabs-rpi-arm64
      project_dir: godot
      check_command: |
        node scripts/check_platform_sdk.mjs
        node --test scripts/tests/*.test.mjs
        REQUIRE_GODOT_EXPORT_TEMPLATES=1 VERIFY_EXPORT_PACKS=1 bash scripts/check_native_export_contract.sh
        bash scripts/godot_quality_gate.sh --project godot --smoke-scene res://tests/test_runner.tscn
        godot --headless --path godot res://tests/balance_sim.tscn
